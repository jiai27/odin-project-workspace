<!DOCTYPE html>

<html lang = "en">          <!--this specifies the web page default language-->
    <head>                  <!--head should not contain content of the page-->
        <meta charset="UTF-8">
        <title>My First Webpage</title>
    </head>

    <body>
        <h1>hello world</h1>
    </body>

</html>
